name: medicines_reminder
description: "A medicine reminder application with Supabase cloud backup."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  sqflite: ^2.4.4
  path: ^1.9.1
  provider: ^6.1.5+1
  intl: ^0.20.3
  uuid: ^4.6.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  permission_handler: 11.3.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.5
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/3d/
